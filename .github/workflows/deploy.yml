name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:

  backend-build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend JAR
        working-directory: ecommerce-backend
        run: mvn clean package -DskipTests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ steps.repo.outputs.repo }}/backend:latest \
          ./ecommerce-backend

      - name: Push Backend Docker Image
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.repo }}/backend:latest


  frontend-build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ steps.repo.outputs.repo }}/frontend:latest \
          ./ecommerce-ui

      - name: Push Frontend Docker Image
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.repo }}/frontend:latest